name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Rebuild better-sqlite3
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Audit (production dependencies)
        # Blocking audit scoped to what a consumer installs: an advisory in a runtime
        # dependency reaches every user of the published package.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit including dev dependencies (report only)
        # Non-blocking visibility for the dev toolchain, which runs only in CI and on a
        # developer's machine. Fix these when an upstream release makes it possible.
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        # `audit:signatures` runs `npm audit signatures` with the npm version package.json pins, here and
        # in npm-audit-remediate.yml / release.yml. The npm 10 bundled with Node 20 / 22 fails a package
        # whose attestations response carries only the keyless provenance bundle (EMISSINGSIGNATUREKEY);
        # npm 11 requires a registry key only for a keyed (publish) attestation.
        run: npm run audit:signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Verify contract version matches the package version
        run: npx cli-contracts version-sync --check
      # The CLI ships the contract embedded in src/generated (`embedoc extract`).
      # version-sync only checks cli-contract.yaml, so the embedded copy could
      # lag behind it (it said 0.14.5 while the package was 0.14.9).
      - name: Verify generated CLI files match cli-contract.yaml
        run: npx cli-contracts generate && git diff --exit-code -- src/generated docs/cli-reference.md
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Verify package contents
        run: npm pack --dry-run
