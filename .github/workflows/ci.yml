name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Rebuild better-sqlite3
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Verify contract version matches the package version
        run: npx cli-contracts version-sync --check
      # The CLI ships the contract embedded in src/generated (`embedoc extract`).
      # version-sync only checks cli-contract.yaml, so the embedded copy could
      # lag behind it (it said 0.14.5 while the package was 0.14.9).
      - name: Verify generated CLI files match cli-contract.yaml
        run: npx cli-contracts generate && git diff --exit-code -- src/generated docs/cli-reference.md
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Verify package contents
        run: npm pack --dry-run
