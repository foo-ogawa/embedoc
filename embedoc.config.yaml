# embedoc configuration for self-documentation
version: "1.0"

targets:
  - pattern: "./README.md"
    comment_style: html
  - pattern: "./docs/**/*.md"
    comment_style: html

datasources:
  # Public API of src/embed-api.ts, written to docs/api/README.md (npm run docs)
  embed_api:
    type: typescript
    entry_points:
      - "./src/embed-api.ts"
    source_link_template: "https://github.com/foo-ogawa/embedoc/blob/{gitRevision}/{path}#L{line}"
    git_revision: main

renderers_dir: "./embeds"

